<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animation Lab</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2236; font-family: system-ui, sans-serif; color: #f4ecff; }
      #ui { position: fixed; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #fff3; background: #fff1; color: inherit; cursor: pointer; }
      button.on { background: #ffb547; color: #2a1600; }
      input[type=range] { width: 260px; }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <script type="module" src="/src/lab.js"></script>
  </body>
</html>
